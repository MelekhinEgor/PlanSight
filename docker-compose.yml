# PlanSight — Docker (VPS ~2 CPU / 2 GB RAM)
#
# Пустая БД:
#   docker compose up -d --build
# Демо (Строгино + портфель из product_demo/):
#   docker compose -f docker-compose.yml -f compose.product-demo.yml up -d --build
#
# Нужен файл весов на хосте: models/yolo11s_combined_v1_best.pt

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "${PLANSIGHT_API_PORT:-8010}:8010"
    environment:
      PLANSIGHT_DATABASE_PATH: /data/plansight.db
      PLANSIGHT_UPLOADS_DIR: /data/uploads
      PLANSIGHT_RBAC: ${PLANSIGHT_RBAC:-0}
      PLANSIGHT_API_TOKEN: ${PLANSIGHT_API_TOKEN:-}
      PLANSIGHT_AI_MODE: ${PLANSIGHT_AI_MODE:-template}
      PLANSIGHT_INIT_MODE: ${PLANSIGHT_INIT_MODE:-empty}
      PLANSIGHT_PRODUCT_DEMO_DIR: /app/product_demo
    volumes:
      - plansight_data:/data
      - ./models:/models:ro
    mem_limit: 1536m
    cpus: 1.5
    command: >
      sh -c "python -c \"from app.db.models import init_db; from app.db.migrate import ensure_schema_patches; init_db(); ensure_schema_patches()\"
      && uvicorn app.main:app --host 0.0.0.0 --port 8010 --workers 1 --limit-concurrency 20"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${PLANSIGHT_WEB_PORT:-5175}:80"
    depends_on:
      api:
        condition: service_started
    mem_limit: 256m
    cpus: 0.5

volumes:
  plansight_data:
